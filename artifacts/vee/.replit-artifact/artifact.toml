kind = "mobile"
previewPath = "/vee/"
title = "Vee Social Audio App"
description = "A multilingual social audio app with Firebase authentication, friend requests, real-time direct messaging, stories, voice calls, voice rooms, gifts, wallet, and push notifications."
version = "1.0.0"
id = "artifacts/vee"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/vee/" ]
localPort = 21175

[services.development]
run = "pnpm --filter @workspace/vee run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/vee", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/vee", "run", "serve" ]

[services.env]
PORT = "21175"
BASE_PATH = "/vee/"
